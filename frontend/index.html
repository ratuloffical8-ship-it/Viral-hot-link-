    <style>
      html,

      .boot {
        min-height: 100vh;

    <!-- Telegram Mini App SDK: loaded ONLY inside Telegram.
         For normal visitors it is skipped, so it can never block the page. -->
    <script>
      (function () {
        var hash = window.location.hash || '';
        var search = window.location.search || '';
        if (hash.indexOf('tgWebApp') !== -1 || search.indexOf('tgWebApp') !== -1) {
          document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
        }
      })();
    </script>
  </head>

    <div id="root"><div class="boot">Loading...</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
